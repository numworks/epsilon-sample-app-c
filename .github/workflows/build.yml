name: Build NWA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          npm install -g nwlink

      - name: Compiler
        run: make build

      - name: Envoyer le .nwa
        uses: actions/upload-artifact@v4
        with:
          name: survie-nwa
          path: output/*.nwa
